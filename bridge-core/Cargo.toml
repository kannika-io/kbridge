[package]
name = "bridge-core"
version.workspace = true
authors.workspace = true
description.workspace = true
edition.workspace = true

[features]
test-utils = ["dep:testcontainers"]

[dependencies]
rdkafka = { git = "https://github.com/wserr/rust-rdkafka.git", branch = "feat/add-list-consumer-group-offsets-admin-api-call", features = ["ssl", "gssapi", "sasl"] }
log = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
csv = { workspace = true }
serde = { version = "1", features = ["derive"] }
futures = { workspace = true }
pin-project = { workspace = true }
strum = { workspace = true, features = ["derive"] }
ahash = { workspace = true }
maplit = { workspace = true }
ulid = { workspace = true }
lazy_static = { workspace = true }
regex = { workspace = true }
itertools = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
testcontainers = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
rdkafka = { git = "https://github.com/wserr/rust-rdkafka.git", branch = "feat/add-list-consumer-group-offsets-admin-api-call", features = ["ssl", "gssapi", "sasl", "cmake-build"] }

[dev-dependencies]
bridge-core = { path = ".", features = ["test-utils"] }
anyhow = "1"
indoc = "2"
assert_matches = "1.5.0"
tempfile = "3.23.0"
env_logger = { workspace = true }
testcontainers = { workspace = true }
serial_test = "3"
