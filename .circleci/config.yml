version: 2.1

# define this file as the setup phase of your dynamic configuration
setup: false


always: &always
  tags:
    only: /.*/
  branches:
    only: /.*/

docker-context: &docker-context
  - prj-product-d-kannika-3bcd-artifact-registry-d-kannika-docker-internal
  - product-pool-gcp-oidc
  - prj-product-d-kannika-3bcd
  - slack-auth-token
  - dependency-tracker-api-key

cache-context: &cache-context
  - prj-product-d-kannika-3bcd-artifact-registry-d-kannika-docker-internal
  - prj-product-d-kannika-3bcd-artifact-registry-d-kannika-docker-internal-cache-cache
  - product-pool-gcp-oidc
  - prj-product-d-kannika-3bcd
  - slack-auth-token

# define the parameters that will be used to generate the dynamic configuration.
parameters:
  arm:
    type: boolean
    default: true
  push:
    type: boolean
    default: true

# invoke the orbs to filter, pack and continue configs.
orbs:
  orbert-downey-jr: cymo-eu/orbert-downey-jr@2.2.0
  orbert-deniro: cymo-eu/orbert-deniro@0.1.1

workflows:
  build:
    jobs:
      # =================
      # AMD build artifact
      - orbert-downey-jr/docker_buildx:
          filters: *always
          executor: orbert-downey-jr/ubuntu_2204_medium
          name: docker_build_amd
          image: kannika-bridge-cli
          image_tag: <<pipeline.number>>-amd64
          directory: bridge-cli
          use_docker_buildkit: true
          # extra_build_args: --ssh default
          # git_pull_submodules: true
          # push_gar: << pipeline.parameters.push >> 
          cache: $CIRCLE_BRANCH #if invoked by tag var is empty and cache will be disabled
          cache_key: $CIRCLE_BRANCH/amd
          cache_repo: $CACHE_ARTIFACT_REGISTRY_URL/$CACHE_ARTIFACT_REGISTRY_PROJECT/$CACHE_ARTIFACT_REGISTRY_NAME
          persist_to_workspace: true
          context: *cache-context
      # =================
      # ARM build artifact
      - orbert-downey-jr/docker_buildx:
          filters: *always
          executor: orbert-downey-jr/ubuntu_2204_medium_arm
          name: docker_build_arm
          image: kannika-bridge-cli
          image_tag: <<pipeline.number>>-arm64
          directory: bridge-cli
          use_docker_buildkit: true
          # extra_build_args: --ssh default
          # git_pull_submodules: true
          # push_gar: << pipeline.parameters.push >> 
          cache: $CIRCLE_BRANCH #if invoked by tag var is empty and cache will be disabled
          cache_key: $CIRCLE_BRANCH/arm
          cache_repo: $CACHE_ARTIFACT_REGISTRY_URL/$CACHE_ARTIFACT_REGISTRY_PROJECT/$CACHE_ARTIFACT_REGISTRY_NAME
          enabled: << pipeline.parameters.arm >> 
          persist_to_workspace: true
          context: *cache-context
      # =================
      # manifest
      # create docker manifest and push images/manifest
      - orbert-downey-jr/docker_create_manifest_gar:
          filters: *always
          image_name: kannika-bridge-core
          manifest_version: <<pipeline.number>>-manifest
          context: *docker-context
          requires:
            - docker_build_amd
            - docker_build_arm