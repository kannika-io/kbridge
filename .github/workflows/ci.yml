name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsasl2-dev just
    
    - name: Run tests
      run: cargo test --verbose

  build:
   needs: check
   runs-on: ubuntu-latest

   steps:
   - uses: actions/checkout@v4

   - name: Install Rust
     uses: dtolnay/rust-toolchain@stable
     with:
       targets: x86_64-unknown-linux-gnu

   - name: Cache system dependencies
     uses: actions/cache@v3
     with:
       path: |
         /var/cache/apt
         /var/lib/apt
       key: ${{ runner.os }}-apt-${{ hashFiles('**/Cargo.lock') }}
       restore-keys: |
         ${{ runner.os }}-apt-

   - name: Install system dependencies
     run: |
       sudo apt-get update
       sudo apt-get install -y libsasl2-dev libssl-dev pkg-config build-essential

   - name: Cache cargo registry
     uses: actions/cache@v3
     with:
       path: |
         ~/.cargo/registry
         ~/.cargo/git
         target
       key: ${{ runner.os }}-x86_64-unknown-linux-gnu-cargo-${{ hashFiles('**/Cargo.lock') }}

   - name: Build binary
     run: cargo build --release --target x86_64-unknown-linux-gnu --verbose

   - name: Upload binary artifact
     uses: actions/upload-artifact@v4
     with:
       name: kbridge-linux-x86_64
       path: target/x86_64-unknown-linux-gnu/release/kbridge

   - name: Create Release
     if: startsWith(github.ref, 'refs/tags/')
     uses: softprops/action-gh-release@v1
     with:
       files: target/x86_64-unknown-linux-gnu/release/kbridge
       generate_release_notes: true
     env:
       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tag pushes are covered by the Release workflow instead.
  docker:
    name: Docker build ${{ matrix.platform }}
    if: "!startsWith(github.ref, 'refs/tags/')"
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
