  build:
#   needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: bridge-cli
            artifact_name: bridge-cli-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: bridge-cli.exe
            artifact_name: bridge-cli-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: bridge-cli
            artifact_name: bridge-cli-macos-x86_64
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsasl2-dev libssl-dev pkg-config build-essential
    
    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cyrus-sasl openssl pkg-config
        echo "PKG_CONFIG_PATH=$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix cyrus-sasl)/lib/pkgconfig" >> $GITHUB_ENV
        echo "LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix cyrus-sasl)/lib:$(brew --prefix openssl)/lib" >> $GITHUB_ENV
        echo "CPATH=$(brew --prefix)/include:$(brew --prefix cyrus-sasl)/include:$(brew --prefix openssl)/include" >> $GITHUB_ENV
        echo "LDFLAGS=-L$(brew --prefix)/lib -L$(brew --prefix cyrus-sasl)/lib -L$(brew --prefix openssl)/lib" >> $GITHUB_ENV
        echo "CPPFLAGS=-I$(brew --prefix)/include -I$(brew --prefix cyrus-sasl)/include -I$(brew --prefix openssl)/include" >> $GITHUB_ENV

    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        echo "Doing nothing"
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build binary
      run: cargo build --release --target ${{ matrix.target }} --verbose
    
    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: target/${{ matrix.target }}/release/${{ matrix.binary_name }}
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: target/${{ matrix.target }}/release/${{ matrix.binary_name }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
