[workspace]
resolver="3"
members=["bridge-cli", "bridge-core"]

[workspace.package]
version = "0.1.1"
authors = ["Willem Serruys", "Tom Verelst"]
description = "A tool to restore consumer group offsets"
edition = "2024"
license = "BUSL-1.1"

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0.17"
csv = "1.3.1"
serde = { version = "1", features = ["serde_derive"] }
tokio = { version = "1.47.1", features = ["full"] }
futures = "0.3"
strum = { version = "0", features = ["derive"] }
pin-project = "1.1"
ahash = "0.8"
maplit = "1"
ulid = "1"
lazy_static = "1"
regex = "1"
itertools = "0.15"
testcontainers = "0.26"
async-trait = "0.1"
