[workspace]
resolver="3"
members=["bridge-cli", "bridge-core"]

[workspace.package]
version = "0.1.0"
authors = ["Willem Serruys"]
description = "A tool to restore consumer group offsets"
edition = "2024"

[workspace.dependencies]
kafka = "0.10.0"
rdkafka = { version ="0.38.0",  features = ["cmake-build", "ssl", "gssapi", "sasl"] }
tokio = { version = "1.47.1", features = ["full"] }
log = "0.4.27"
thiserror = "2.0.17"
csv = "1.3.1"
serde = { version = "1.0.228", features = ["serde_derive"] }
env_logger = "0.11.8"
