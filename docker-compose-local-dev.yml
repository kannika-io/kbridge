services:
  redpanda-console-source:
    image: redpandadata/console:latest
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["broker-source:29092"]
    ports:
      - "8180:8080"
    depends_on:
      broker-source:
        condition: service_healthy
  redpanda-console-target:
    image: redpandadata/console:latest
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["broker-target:29092"]
    ports:
      - "8181:8080"
    depends_on:
      broker-target:
        condition: service_healthy
